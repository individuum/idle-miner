<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1612">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Idle Miner</title>
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<div class="game">
  <header class="hud">
    <div class="money">$<span id="money">0</span></div>
    <div class="rate"><span id="rate">0</span>/s</div>
    <div class="buffs-bar" id="buffs-bar"></div>
    <button id="settings-btn" class="hud-btn" title="Settings &amp; save">⚙</button>
  </header>

  <nav class="zone-tabs" id="zone-tabs"></nav>

  <div class="scene">
    <div class="scene-bg" id="scene-bg" data-zone="surface"></div>
    <div class="scene-particles" id="scene-particles"></div>

    <div class="surface">
      <div class="dropoff" id="dropoff">
        <div class="label">Surface</div>
        <div class="ore-count" id="dropoff-count">0</div>
      </div>
      <div class="walkway">
        <div class="worker" id="worker">
          <div class="worker-body" id="worker-body"></div>
          <div class="worker-cargo" id="worker-cargo">0</div>
        </div>
      </div>
      <div class="processor" id="processor">
        <div class="proc-icon">⚙</div>
        <div class="label">Processor</div>
        <div class="proc-bar"><div class="proc-bar-fill" id="proc-bar"></div></div>
        <div class="proc-buffer" id="proc-buffer">0</div>
        <div class="proc-steam"></div>
      </div>
    </div>

    <div class="underground">
      <div class="elevator-shaft">
        <div class="cable cable-l"></div>
        <div class="cable cable-r"></div>
        <div class="elevator" id="elevator">
          <div class="elev-fill" id="elev-fill"></div>
          <div class="elev-cargo" id="elev-cargo">0/0</div>
        </div>
      </div>
      <div class="shafts" id="shafts"></div>
    </div>
  </div>

  <div class="upgrades" id="upgrades"></div>
  <div class="fx-layer" id="fx"></div>
</div>

<div id="offline-modal" class="modal hidden">
  <div class="modal-content">
    <h2>Welcome back!</h2>
    <p>While you were away (<span id="offline-time"></span>), your mines earned:</p>
    <div class="offline-earned">$<span id="offline-money">0</span></div>
    <button id="offline-close">Collect</button>
  </div>
</div>

<div id="settings-modal" class="modal hidden">
  <div class="modal-content settings">
    <h2>Settings</h2>
    <p class="settings-help">Save data is base64-encoded JSON. Copy it to back up your run; paste to restore on another device.</p>
    <textarea id="save-textarea" placeholder="Paste save data here to import..." spellcheck="false"></textarea>
    <div class="settings-row">
      <button id="export-btn">Export Save</button>
      <button id="import-btn">Import Save</button>
    </div>
    <div class="settings-row">
      <button id="reset-btn-modal" class="danger">Reset Game</button>
      <button id="settings-close">Close</button>
    </div>
    <div id="settings-status" class="settings-status"></div>
  </div>
</div>

<script src="game.js?v=17"></script>
</body>
</html>
